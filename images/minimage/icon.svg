<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minimage">
  <defs>
    <linearGradient id="mi-tile" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- full-bleed app-icon tile -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#mi-tile)"/>
  <!-- stacked frames suggesting a batch / matrix of images -->
  <rect x="40" y="40" width="62" height="62" rx="12" fill="#fff" opacity="0.22"/>
  <rect x="30" y="30" width="62" height="62" rx="12" fill="#fff" opacity="0.32"/>
  <!-- front frame holding the "photo" -->
  <rect x="20" y="20" width="62" height="62" rx="12" fill="#fff"/>
  <!-- the "image" inside: sun + mountains -->
  <clipPath id="mi-clip">
    <rect x="20" y="20" width="62" height="62" rx="12"/>
  </clipPath>
  <g clip-path="url(#mi-clip)">
    <circle cx="38" cy="38" r="8" fill="#f59e0b"/>
    <path d="M20 82 L42 54 L56 70 L70 52 L82 70 L82 82 Z" fill="url(#mi-tile)"/>
    <path d="M20 82 L36 64 L52 82 Z" fill="#7c3aed" opacity="0.85"/>
  </g>
</svg>
