<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b25"/>
      <stop offset="48%" stop-color="#101317"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C078"/>
      <stop offset="55%" stop-color="#E6A055"/>
      <stop offset="100%" stop-color="#E6521F"/>
    </linearGradient>
    <linearGradient id="amberH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2C078"/>
      <stop offset="55%" stop-color="#E6A055"/>
      <stop offset="100%" stop-color="#E6521F"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E6521F" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#E6521F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181d27"/>
      <stop offset="100%" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="connFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2C078"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <circle cx="1180" cy="90" r="320" fill="url(#amberGlow)"/>
  <circle cx="160" cy="520" r="300" fill="url(#greenGlow)"/>
  <circle cx="900" cy="540" r="260" fill="url(#cyanGlow)"/>

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 93 H1400 M0 186 H1400 M0 279 H1400 M0 372 H1400 M0 465 H1400"/>
    <path d="M200 0 V560 M400 0 V560 M600 0 V560 M800 0 V560 M1000 0 V560 M1200 0 V560"/>
  </g>

  <!-- Left column: brand + message -->
  <g transform="translate(90,86)">
    <g filter="url(#softGlow)">
      <rect x="0" y="0" width="84" height="84" rx="20" fill="#0e1116" stroke="url(#amber)" stroke-width="2.5"/>
      <text x="42" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="66" fill="url(#amber)" letter-spacing="-3">Q</text>
    </g>
    <g transform="translate(104,18)" font-weight="800" letter-spacing="-1">
      <text x="0" y="40" font-size="52" fill="#ffffff">Auto</text>
      <text x="116" y="40" font-size="52" fill="url(#amberH)">QAI</text>
    </g>
    <text x="106" y="76" font-size="17" fill="#8b94a3" font-weight="500" letter-spacing="0.4">AI-driven browser testing for developers &amp; QA</text>
  </g>

  <g transform="translate(90,232)">
    <text x="0" y="0" font-size="46" font-weight="800" fill="#f4f6fa" letter-spacing="-1">Let your AI agent test in</text>
    <text x="0" y="58" font-size="46" font-weight="800" letter-spacing="-1">
      <tspan fill="#6ee7b7">your real, logged-in</tspan><tspan fill="#f4f6fa"> browser.</tspan>
    </text>
    <text x="2" y="104" font-size="19" fill="#9aa3b2" font-weight="500">No fresh Selenium or Playwright. No re-login. The agent drives the very tab</text>
    <text x="2" y="132" font-size="19" fill="#9aa3b2" font-weight="500">you're already signed in to — same SSO, cookies, tenant &amp; feature flags.</text>
  </g>

  <!-- Feature pills -->
  <g transform="translate(90,418)" font-size="15" font-weight="600">
    <g>
      <rect x="0" y="0" width="172" height="34" rx="17" fill="rgba(242,192,120,0.10)" stroke="rgba(242,192,120,0.35)"/>
      <text x="86" y="22" text-anchor="middle" fill="#F2C078">End-to-end testing</text>
    </g>
    <g transform="translate(186,0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="rgba(110,231,183,0.10)" stroke="rgba(110,231,183,0.35)"/>
      <text x="85" y="22" text-anchor="middle" fill="#6ee7b7">Bug reproduction</text>
    </g>
    <g transform="translate(370,0)">
      <rect x="0" y="0" width="158" height="34" rx="17" fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.35)"/>
      <text x="79" y="22" text-anchor="middle" fill="#67e8f9">UI comparisons</text>
    </g>
    <g transform="translate(542,0)">
      <rect x="0" y="0" width="148" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
      <text x="74" y="22" text-anchor="middle" fill="#c7cdd6">Local-only · MCP</text>
    </g>
  </g>

  <text x="90" y="500" font-size="14" font-weight="600" letter-spacing="0.3" fill="#6b7280">
    Works with <tspan fill="#cfd4dc">Claude Code</tspan>, <tspan fill="#cfd4dc">Cursor</tspan>, <tspan fill="#cfd4dc">VS Code Copilot</tspan> &amp; <tspan fill="#cfd4dc">Kiro</tspan>  ·  utilsware.com/products/autoqai
  </text>

  <!-- Right column: agent -> MCP -> browser flow -->
  <g transform="translate(840,118)">
    <!-- connecting flow line -->
    <path d="M105 105 H205" stroke="url(#connFlow)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M305 105 H405" stroke="url(#connFlow)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Node 1: AI agent (terminal) -->
    <g transform="translate(0,40)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="105" height="130" rx="16" fill="url(#cardBg)" stroke="rgba(242,192,120,0.30)" stroke-width="1.5"/>
      <rect x="14" y="16" width="77" height="50" rx="8" fill="#0a0c10" stroke="rgba(255,255,255,0.08)"/>
      <text x="22" y="34" font-family="ui-monospace, 'Courier New', monospace" font-size="10" fill="#6ee7b7">$ agent</text>
      <text x="22" y="48" font-family="ui-monospace, 'Courier New', monospace" font-size="10" fill="#8b94a3">› test</text>
      <text x="22" y="60" font-family="ui-monospace, 'Courier New', monospace" font-size="10" fill="#F2C078">login ✓</text>
      <text x="52" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f6fa">AI Agent</text>
      <text x="52" y="110" text-anchor="middle" font-size="10.5" fill="#8b94a3">Claude · Cursor</text>
    </g>

    <!-- Node 2: MCP server -->
    <g transform="translate(205,40)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="100" height="130" rx="16" fill="url(#cardBg)" stroke="rgba(110,231,183,0.30)" stroke-width="1.5"/>
      <g transform="translate(50,46)">
        <circle r="26" fill="none" stroke="rgba(110,231,183,0.25)" stroke-width="1.5"/>
        <circle r="9" fill="#10b981"/>
        <circle cx="0" cy="-26" r="4.5" fill="#6ee7b7"/>
        <circle cx="22" cy="14" r="4.5" fill="#6ee7b7"/>
        <circle cx="-22" cy="14" r="4.5" fill="#6ee7b7"/>
        <path d="M0 -9 V-22 M7 5 L18 11 M-7 5 L-18 11" stroke="rgba(110,231,183,0.5)" stroke-width="1.5"/>
      </g>
      <text x="50" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f6fa">MCP Server</text>
      <text x="50" y="116" text-anchor="middle" font-size="10.5" fill="#8b94a3">127.0.0.1 · local</text>
    </g>

    <!-- Node 3: browser tab -->
    <g transform="translate(405,18)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="170" height="174" rx="16" fill="url(#cardBg)" stroke="rgba(34,211,238,0.30)" stroke-width="1.5"/>
      <rect x="0" y="0" width="170" height="34" rx="16" fill="rgba(255,255,255,0.03)"/>
      <circle cx="18" cy="17" r="4" fill="#e6521f"/>
      <circle cx="33" cy="17" r="4" fill="#e6a055"/>
      <circle cx="48" cy="17" r="4" fill="#10b981"/>
      <rect x="64" y="9" width="92" height="16" rx="8" fill="#0a0c10" stroke="rgba(255,255,255,0.06)"/>
      <text x="72" y="21" font-family="ui-monospace, 'Courier New', monospace" font-size="9" fill="#6ee7b7">app.yoursite.com</text>

      <rect x="16" y="48" width="138" height="12" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="16" y="68" width="100" height="9" rx="3" fill="rgba(255,255,255,0.05)"/>
      <rect x="16" y="84" width="120" height="9" rx="3" fill="rgba(255,255,255,0.05)"/>
      <rect x="16" y="108" width="74" height="26" rx="7" fill="url(#amber)"/>
      <text x="53" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1a0f06">Save</text>
      <rect x="100" y="108" width="54" height="26" rx="7" fill="none" stroke="rgba(255,255,255,0.18)"/>
      <text x="127" y="125" text-anchor="middle" font-size="11" fill="#c7cdd6">Cancel</text>
      <text x="85" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#67e8f9">Your authenticated tab</text>
    </g>
  </g>
</svg>
