<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0B1F"/>
      <stop offset="50%" style="stop-color:#120E2E"/>
      <stop offset="100%" style="stop-color:#0A0818"/>
    </linearGradient>

    <!-- Purple glow for logo area -->
    <radialGradient id="glowLeft" cx="28%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#3C3489;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#0D0B1F;stop-opacity:0"/>
    </radialGradient>

    <!-- Subtle right glow -->
    <radialGradient id="glowRight" cx="78%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#6560CC;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0D0B1F;stop-opacity:0"/>
    </radialGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1A42"/>
      <stop offset="100%" style="stop-color:#16133A"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1740"/>
      <stop offset="100%" style="stop-color:#221E50"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#201C48"/>
      <stop offset="100%" style="stop-color:#171440"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9F99E8;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#9F99E8;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#6560CC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6560CC;stop-opacity:0"/>
    </linearGradient>

    <!-- Shimmer on badge -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3C3489"/>
      <stop offset="100%" style="stop-color:#6560CC"/>
    </linearGradient>

    <!-- Dot grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9F99E8" opacity="0.08"/>
    </pattern>

    <!-- Drop shadow for logo -->
    <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.55  0 0 0 0 0.9  0 0 0 0.8 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Clip for tile boundary -->
    <clipPath id="tileClip">
      <rect width="1400" height="560"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Base background -->
    <rect width="1400" height="560" fill="url(#bgGrad)"/>

    <!-- Dot grid overlay -->
    <rect width="1400" height="560" fill="url(#dotGrid)"/>

    <!-- Ambient glows -->
    <rect width="1400" height="560" fill="url(#glowLeft)"/>
    <rect width="1400" height="560" fill="url(#glowRight)"/>

    <!-- Large decorative circle arc top-left -->
    <circle cx="120" cy="100" r="220" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.1"/>
    <circle cx="120" cy="100" r="300" fill="none" stroke="#6560CC" stroke-width="0.4" opacity="0.07"/>

    <!-- Large decorative circle arc bottom-right -->
    <circle cx="1320" cy="480" r="250" fill="none" stroke="#9F99E8" stroke-width="0.5" opacity="0.08"/>
    <circle cx="1320" cy="480" r="350" fill="none" stroke="#6560CC" stroke-width="0.4" opacity="0.05"/>

    <!-- Horizontal divider line (accent) -->
    <rect x="260" y="279" width="880" height="1" fill="url(#lineGrad)" opacity="0.3"/>

    <!-- ═══════════════════════════════════ -->
    <!-- LEFT SIDE: Logo + Branding         -->
    <!-- ═══════════════════════════════════ -->

    <!-- Logo glow backdrop -->
    <circle cx="200" cy="230" r="100" fill="#3C3489" opacity="0.18"/>
    <circle cx="200" cy="230" r="68" fill="#3C3489" opacity="0.12"/>

    <!-- Logo SVG scaled up, centered at ~200,210 -->
    <g transform="translate(136, 146) scale(1.0)" filter="url(#logoGlow)">
      <path d="M64 10 L108 24 L108 72 Q108 104 64 120 Q20 104 20 72 L20 24 Z"
            fill="#3C3489" stroke="#9F99E8" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="32" y="36" width="64" height="14" rx="4" fill="#534AB7" opacity="0.6"/>
      <rect x="38" y="40" width="28" height="3" rx="1.5" fill="#D0CCFF" opacity="0.8"/>
      <rect x="38" y="45" width="18" height="2" rx="1" fill="#AFA9EC" opacity="0.5"/>
      <rect x="80" y="39" width="10" height="5" rx="2.5" fill="#9F99E8" opacity="0.7"/>
      <rect x="32" y="56" width="64" height="14" rx="4" fill="#6560CC" opacity="0.85"/>
      <rect x="38" y="60" width="22" height="3" rx="1.5" fill="#E0DEFF" opacity="0.9"/>
      <rect x="38" y="65" width="14" height="2" rx="1" fill="#C4C0F5" opacity="0.6"/>
      <rect x="80" y="59" width="10" height="5" rx="2.5" fill="#C4C0F5" opacity="0.8"/>
      <rect x="32" y="76" width="64" height="14" rx="4" fill="#8F8AE8"/>
      <rect x="38" y="80" width="26" height="3" rx="1.5" fill="white" opacity="0.95"/>
      <rect x="38" y="85" width="16" height="2" rx="1" fill="white" opacity="0.6"/>
      <rect x="80" y="79" width="10" height="5" rx="2.5" fill="white" opacity="0.9"/>
      <line x1="40" y1="101" x2="88" y2="101" stroke="#C4C0F5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="47" y1="108" x2="81" y2="108" stroke="#C4C0F5" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <line x1="55" y1="115" x2="73" y2="115" stroke="#E0DEFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Toolship wordmark -->
    <text x="136" y="320" font-family="'Georgia', 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-1" fill="white" opacity="0.97">Toolship</text>

    <!-- Accent underline under wordmark -->
    <rect x="136" y="330" width="190" height="2.5" rx="1.5" fill="url(#badgeGrad)" opacity="0.85"/>

    <!-- Tagline -->
    <text x="136" y="365" font-family="'Georgia', 'Times New Roman', serif" font-size="16" fill="#AFA9EC" letter-spacing="0.5" opacity="0.9">Browser Toolkit for Developers &amp; QA</text>

    <!-- "All Browsers" label -->
    <text x="136" y="388" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#9F99E8" letter-spacing="2" opacity="0.55">WORKS ON ALL MAJOR BROWSERS</text>

    <!-- Browser icons row -->
    <!-- Chrome -->
    <circle cx="152" cy="415" r="13" fill="#1a1740" stroke="#9F99E8" stroke-width="0.8" opacity="1"/>
    <circle cx="152" cy="415" r="8" fill="none" stroke="#4285F4" stroke-width="2.5" opacity="0.9"/>
    <circle cx="152" cy="415" r="3.5" fill="#4285F4" opacity="0.95"/>
    <path d="M152 407 A8 8 0 0 1 159 411" fill="none" stroke="#EA4335" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M159 411 A8 8 0 0 1 152 423" fill="none" stroke="#FBBC05" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M152 423 A8 8 0 0 1 144 415 A8 8 0 0 1 152 407" fill="none" stroke="#34A853" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Firefox -->
    <circle cx="192" cy="415" r="13" fill="#1a1740" stroke="#9F99E8" stroke-width="0.8" opacity="1"/>
    <circle cx="192" cy="415" r="8" fill="#FF6611" opacity="0.85"/>
    <circle cx="192" cy="415" r="5" fill="#FFB830" opacity="0.9"/>
    <circle cx="192" cy="413" r="2.5" fill="#1a1740" opacity="0.7"/>

    <!-- Edge -->
    <circle cx="232" cy="415" r="13" fill="#1a1740" stroke="#9F99E8" stroke-width="0.8" opacity="1"/>
    <path d="M224 415 Q225 407 232 406 Q241 406 241 413 Q241 418 235 420 Q229 422 227 419 Q232 420 235 417 Q238 414 236 411 Q233 408 228 410 Z" fill="#0078D4" opacity="0.9"/>
    <path d="M226 418 Q228 423 234 423 Q239 423 241 419" fill="none" stroke="#50C0FF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <!-- Safari -->
    <circle cx="272" cy="415" r="13" fill="#1a1740" stroke="#9F99E8" stroke-width="0.8" opacity="1"/>
    <circle cx="272" cy="415" r="8.5" fill="none" stroke="#4A90D9" stroke-width="1.5" opacity="0.7"/>
    <line x1="272" y1="406.5" x2="272" y2="423.5" stroke="#8EB8E8" stroke-width="0.8" opacity="0.4"/>
    <line x1="263.5" y1="415" x2="280.5" y2="415" stroke="#8EB8E8" stroke-width="0.8" opacity="0.4"/>
    <polygon points="272,407.5 274,413.5 272,412 270,413.5" fill="#E63B3B" opacity="0.9"/>
    <polygon points="272,422.5 270,416.5 272,418 274,416.5" fill="#D0D0D0" opacity="0.8"/>

    <!-- Vertical separator -->
    <line x1="400" y1="120" x2="400" y2="440" stroke="#9F99E8" stroke-width="0.8" opacity="0.12"/>

    <!-- ═══════════════════════════════════ -->
    <!-- RIGHT SIDE: Feature Cards          -->
    <!-- ═══════════════════════════════════ -->

    <!-- Section label -->
    <text x="448" y="148" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#9F99E8" letter-spacing="3" opacity="0.6">EVERYTHING YOU NEED</text>

    <!-- Row 1 cards -->

    <!-- Card: Request Handling -->
    <rect x="448" y="165" width="218" height="100" rx="10" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
    <rect x="448" y="165" width="218" height="100" rx="10" fill="none" stroke="#9F99E8" stroke-width="0.8" opacity="0.2"/>
    <rect x="448" y="165" width="3" height="100" rx="1.5" fill="#9F99E8" opacity="0.6"/>
    <!-- Icon: arrows -->
    <text x="468" y="202" font-size="22" font-family="serif">🔀</text>
    <text x="500" y="200" font-family="'Georgia', 'Times New Roman', serif" font-size="14" font-weight="700" fill="white" opacity="0.95">Request Handling</text>
    <text x="500" y="218" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">Intercept, modify &amp; redirect</text>
    <text x="500" y="233" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">with rule-based handlers</text>
    <text x="468" y="248" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#6560CC" opacity="0.9">Headers · Proxy · User Agent</text>

    <!-- Card: Storage -->
    <rect x="682" y="165" width="218" height="100" rx="10" fill="url(#cardGrad2)" filter="url(#cardShadow)"/>
    <rect x="682" y="165" width="218" height="100" rx="10" fill="none" stroke="#9F99E8" stroke-width="0.8" opacity="0.2"/>
    <rect x="682" y="165" width="3" height="100" rx="1.5" fill="#8F8AE8" opacity="0.6"/>
    <text x="702" y="202" font-size="22" font-family="serif">🗄️</text>
    <text x="734" y="200" font-family="'Georgia', 'Times New Roman', serif" font-size="14" font-weight="700" fill="white" opacity="0.95">Storage Editor</text>
    <text x="734" y="218" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">Browse, edit &amp; delete records</text>
    <text x="734" y="233" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">in any IndexedDB database</text>
    <text x="702" y="248" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#8F8AE8" opacity="0.9">SQL Filters · JSON Tree · Tables</text>

    <!-- Card: Security -->
    <rect x="916" y="165" width="218" height="100" rx="10" fill="url(#cardGrad3)" filter="url(#cardShadow)"/>
    <rect x="916" y="165" width="218" height="100" rx="10" fill="none" stroke="#9F99E8" stroke-width="0.8" opacity="0.2"/>
    <rect x="916" y="165" width="3" height="100" rx="1.5" fill="#C4C0F5" opacity="0.6"/>
    <text x="936" y="202" font-size="22" font-family="serif">🔒</text>
    <text x="968" y="200" font-family="'Georgia', 'Times New Roman', serif" font-size="14" font-weight="700" fill="white" opacity="0.95">Security Tools</text>
    <text x="968" y="218" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">Audit CSP, CORS headers</text>
    <text x="968" y="233" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">and cookie configurations</text>
    <text x="936" y="248" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#C4C0F5" opacity="0.9">CSP · CORS · Cookie Audit</text>

    <!-- Row 2 cards -->

    <!-- Card: Page Tools -->
    <rect x="448" y="285" width="218" height="100" rx="10" fill="url(#cardGrad2)" filter="url(#cardShadow)"/>
    <rect x="448" y="285" width="218" height="100" rx="10" fill="none" stroke="#9F99E8" stroke-width="0.8" opacity="0.2"/>
    <rect x="448" y="285" width="3" height="100" rx="1.5" fill="#6560CC" opacity="0.6"/>
    <text x="468" y="322" font-size="22" font-family="serif">🛠️</text>
    <text x="500" y="320" font-family="'Georgia', 'Times New Roman', serif" font-size="14" font-weight="700" fill="white" opacity="0.95">Page Tools</text>
    <text x="500" y="338" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">Inspect elements, measure,</text>
    <text x="500" y="353" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">preview responsive layouts</text>
    <text x="468" y="368" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#6560CC" opacity="0.9">Inspector · Ruler · Breakpoints</text>

    <!-- Card: Accessibility + Validation -->
    <rect x="682" y="285" width="218" height="100" rx="10" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
    <rect x="682" y="285" width="218" height="100" rx="10" fill="none" stroke="#9F99E8" stroke-width="0.8" opacity="0.2"/>
    <rect x="682" y="285" width="3" height="100" rx="1.5" fill="#9F99E8" opacity="0.6"/>
    <text x="702" y="322" font-size="22" font-family="serif">♿</text>
    <text x="734" y="320" font-family="'Georgia', 'Times New Roman', serif" font-size="14" font-weight="700" fill="white" opacity="0.95">ADA &amp; Validation</text>
    <text x="734" y="338" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">WCAG 2.1 accessibility audits</text>
    <text x="734" y="353" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">and CSS validation checks</text>
    <text x="702" y="368" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#9F99E8" opacity="0.9">Contrast · ARIA · Focus · Labels</text>

    <!-- Card: Export -->
    <rect x="916" y="285" width="218" height="100" rx="10" fill="url(#cardGrad3)" filter="url(#cardShadow)"/>
    <rect x="916" y="285" width="218" height="100" rx="10" fill="none" stroke="#9F99E8" stroke-width="0.8" opacity="0.2"/>
    <rect x="916" y="285" width="3" height="100" rx="1.5" fill="#D0CCFF" opacity="0.6"/>
    <text x="936" y="322" font-size="22" font-family="serif">📤</text>
    <text x="968" y="320" font-family="'Georgia', 'Times New Roman', serif" font-size="14" font-weight="700" fill="white" opacity="0.95">Export &amp; Capture</text>
    <text x="968" y="338" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">Screenshots, tables, links</text>
    <text x="968" y="353" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#AFA9EC" opacity="0.8">and page content in any format</text>
    <text x="936" y="368" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#D0CCFF" opacity="0.9">PNG · CSV · JSON · MD · HTML</text>

    <!-- Row 3: Network log + Performance + Privacy -->
    <rect x="448" y="405" width="140" height="62" rx="8" fill="#13102A" filter="url(#cardShadow)"/>
    <rect x="448" y="405" width="140" height="62" rx="8" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.15"/>
    <text x="468" y="428" font-size="16" font-family="serif">📡</text>
    <text x="492" y="428" font-family="'Georgia', 'Times New Roman', serif" font-size="12" font-weight="700" fill="white" opacity="0.9">Network Log</text>
    <text x="468" y="446" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#AFA9EC" opacity="0.7">Live traffic monitor</text>
    <text x="468" y="459" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#AFA9EC" opacity="0.7">with handler matching</text>

    <rect x="604" y="405" width="140" height="62" rx="8" fill="#13102A" filter="url(#cardShadow)"/>
    <rect x="604" y="405" width="140" height="62" rx="8" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.15"/>
    <text x="622" y="428" font-size="16" font-family="serif">⚡</text>
    <text x="646" y="428" font-family="'Georgia', 'Times New Roman', serif" font-size="12" font-weight="700" fill="white" opacity="0.9">Performance</text>
    <text x="622" y="446" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#AFA9EC" opacity="0.7">TTFB, DNS, load time</text>
    <text x="622" y="459" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#AFA9EC" opacity="0.7">memory &amp; long tasks</text>

    <rect x="760" y="405" width="140" height="62" rx="8" fill="#13102A" filter="url(#cardShadow)"/>
    <rect x="760" y="405" width="140" height="62" rx="8" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.15"/>
    <text x="778" y="428" font-size="16" font-family="serif">🔐</text>
    <text x="802" y="428" font-family="'Georgia', 'Times New Roman', serif" font-size="12" font-weight="700" fill="white" opacity="0.9">100% Private</text>
    <text x="778" y="446" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#AFA9EC" opacity="0.7">All data stays on</text>
    <text x="778" y="459" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#AFA9EC" opacity="0.7">your device only</text>

    <rect x="916" y="405" width="218" height="62" rx="8" fill="#13102A" filter="url(#cardShadow)"/>
    <rect x="916" y="405" width="218" height="62" rx="8" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.15"/>
    <text x="936" y="428" font-size="16" font-family="serif">🧩</text>
    <text x="960" y="428" font-family="'Georgia', 'Times New Roman', serif" font-size="12" font-weight="700" fill="white" opacity="0.9">Templates &amp; Presets</text>
    <text x="936" y="446" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#AFA9EC" opacity="0.7">CORS bypass, auth injection, tracker</text>
    <text x="936" y="459" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" fill="#AFA9EC" opacity="0.7">removal &amp; more — ready to use</text>

  </g>
</svg>
