<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0B1F"/>
      <stop offset="50%" style="stop-color:#120E2E"/>
      <stop offset="100%" style="stop-color:#0A0818"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="38%" r="38%">
      <stop offset="0%" style="stop-color:#3C3489;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0D0B1F;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="65%" r="35%">
      <stop offset="0%" style="stop-color:#6560CC;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0D0B1F;stop-opacity:0"/>
    </radialGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1A42"/>
      <stop offset="100%" style="stop-color:#16133A"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1740"/>
      <stop offset="100%" style="stop-color:#221E50"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#201C48"/>
      <stop offset="100%" style="stop-color:#171440"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3C3489"/>
      <stop offset="100%" style="stop-color:#6560CC"/>
    </linearGradient>

    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9F99E8;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#9F99E8;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#6560CC;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#6560CC;stop-opacity:0"/>
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#9F99E8" opacity="0.09"/>
    </pattern>

    <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.55  0 0 0 0 0.9  0 0 0 0.7 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="tileClip">
      <rect width="440" height="280"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Background -->
    <rect width="440" height="280" fill="url(#bgGrad)"/>
    <rect width="440" height="280" fill="url(#dotGrid)"/>
    <rect width="440" height="280" fill="url(#glowLeft)"/>
    <rect width="440" height="280" fill="url(#glowRight)"/>

    <!-- Decorative arcs -->
    <circle cx="30" cy="40" r="90" fill="none" stroke="#9F99E8" stroke-width="0.5" opacity="0.09"/>
    <circle cx="420" cy="250" r="110" fill="none" stroke="#6560CC" stroke-width="0.4" opacity="0.07"/>

    <!-- ══════════════════════════════ -->
    <!-- TOP: Logo + Name + Browsers   -->
    <!-- ══════════════════════════════ -->

    <!-- Logo glow -->
    <circle cx="46" cy="52" r="36" fill="#3C3489" opacity="0.2"/>

    <!-- Logo scaled to ~0.5x, translated to top-left -->
    <g transform="translate(14, 10) scale(0.5)" filter="url(#logoGlow)">
      <path d="M64 10 L108 24 L108 72 Q108 104 64 120 Q20 104 20 72 L20 24 Z"
            fill="#3C3489" stroke="#9F99E8" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="32" y="36" width="64" height="14" rx="4" fill="#534AB7" opacity="0.6"/>
      <rect x="38" y="40" width="28" height="3" rx="1.5" fill="#D0CCFF" opacity="0.8"/>
      <rect x="38" y="45" width="18" height="2" rx="1" fill="#AFA9EC" opacity="0.5"/>
      <rect x="80" y="39" width="10" height="5" rx="2.5" fill="#9F99E8" opacity="0.7"/>
      <rect x="32" y="56" width="64" height="14" rx="4" fill="#6560CC" opacity="0.85"/>
      <rect x="38" y="60" width="22" height="3" rx="1.5" fill="#E0DEFF" opacity="0.9"/>
      <rect x="38" y="65" width="14" height="2" rx="1" fill="#C4C0F5" opacity="0.6"/>
      <rect x="80" y="59" width="10" height="5" rx="2.5" fill="#C4C0F5" opacity="0.8"/>
      <rect x="32" y="76" width="64" height="14" rx="4" fill="#8F8AE8"/>
      <rect x="38" y="80" width="26" height="3" rx="1.5" fill="white" opacity="0.95"/>
      <rect x="38" y="85" width="16" height="2" rx="1" fill="white" opacity="0.6"/>
      <rect x="80" y="79" width="10" height="5" rx="2.5" fill="white" opacity="0.9"/>
      <line x1="40" y1="101" x2="88" y2="101" stroke="#C4C0F5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="47" y1="108" x2="81" y2="108" stroke="#C4C0F5" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <line x1="55" y1="115" x2="73" y2="115" stroke="#E0DEFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Wordmark -->
    <text x="80" y="44" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="white" opacity="0.97">Toolship</text>
    <!-- Accent underline -->
    <rect x="80" y="50" width="96" height="1.8" rx="1" fill="url(#badgeGrad)" opacity="0.85"/>
    <!-- Tagline -->
    <text x="80" y="66" font-family="'Georgia', 'Times New Roman', serif" font-size="9.5" fill="#AFA9EC" letter-spacing="0.3" opacity="0.85">Browser Toolkit for Developers &amp; QA</text>

    <!-- Browser icons -->
    <!-- Chrome -->
    <circle cx="82" cy="84" r="8" fill="#13102A" stroke="#9F99E8" stroke-width="0.6" opacity="1"/>
    <circle cx="82" cy="84" r="5" fill="none" stroke="#4285F4" stroke-width="1.8" opacity="0.9"/>
    <circle cx="82" cy="84" r="2" fill="#4285F4" opacity="0.95"/>
    <path d="M82 79 A5 5 0 0 1 86.3 81.5" fill="none" stroke="#EA4335" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <path d="M86.3 81.5 A5 5 0 0 1 82 89" fill="none" stroke="#FBBC05" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <path d="M82 89 A5 5 0 0 1 77.7 81.5 A5 5 0 0 1 82 79" fill="none" stroke="#34A853" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

    <!-- Firefox -->
    <circle cx="104" cy="84" r="8" fill="#13102A" stroke="#9F99E8" stroke-width="0.6" opacity="1"/>
    <circle cx="104" cy="84" r="5" fill="#FF6611" opacity="0.85"/>
    <circle cx="104" cy="84" r="3" fill="#FFB830" opacity="0.9"/>
    <circle cx="104" cy="82.5" r="1.5" fill="#13102A" opacity="0.7"/>

    <!-- Edge -->
    <circle cx="126" cy="84" r="8" fill="#13102A" stroke="#9F99E8" stroke-width="0.6" opacity="1"/>
    <path d="M121 84 Q121.5 79 126 78.5 Q131 78.5 131 82.5 Q131 85.5 127.5 86.5 Q124 87.5 122.5 85.5 Q125.5 86 127.5 84.5 Q129.5 83 128.5 81 Q127 79.5 124 80.5 Z" fill="#0078D4" opacity="0.9"/>
    <path d="M122 86 Q123 89 126.5 89 Q130 89 131 86.5" fill="none" stroke="#50C0FF" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

    <!-- Safari -->
    <circle cx="148" cy="84" r="8" fill="#13102A" stroke="#9F99E8" stroke-width="0.6" opacity="1"/>
    <circle cx="148" cy="84" r="5.5" fill="none" stroke="#4A90D9" stroke-width="1" opacity="0.7"/>
    <line x1="148" y1="78.5" x2="148" y2="89.5" stroke="#8EB8E8" stroke-width="0.6" opacity="0.4"/>
    <line x1="142.5" y1="84" x2="153.5" y2="84" stroke="#8EB8E8" stroke-width="0.6" opacity="0.4"/>
    <polygon points="148,79.5 149.2,83 148,82 146.8,83" fill="#E63B3B" opacity="0.9"/>
    <polygon points="148,88.5 146.8,85 148,86 149.2,85" fill="#D0D0D0" opacity="0.8"/>

    <!-- Divider -->
    <rect x="0" y="103" width="440" height="0.8" fill="url(#dividerGrad)"/>

    <!-- ══════════════════════════════ -->
    <!-- BOTTOM: 3x2 Feature Grid      -->
    <!-- ══════════════════════════════ -->

    <!-- Row 1 -->
    <!-- Card: Request Handling -->
    <rect x="12" y="113" width="130" height="72" rx="7" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
    <rect x="12" y="113" width="130" height="72" rx="7" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.2"/>
    <rect x="12" y="113" width="2.5" height="72" rx="1.2" fill="#9F99E8" opacity="0.6"/>
    <text x="22" y="135" font-size="14" font-family="serif">🔀</text>
    <text x="42" y="134" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" font-weight="700" fill="white" opacity="0.95">Request Handling</text>
    <text x="22" y="150" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">Intercept, modify &amp; redirect</text>
    <text x="22" y="161" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">with rule-based handlers</text>
    <text x="22" y="175" font-family="'Georgia', 'Times New Roman', serif" font-size="8" fill="#9F99E8" opacity="0.85">Headers · Proxy · User Agent</text>

    <!-- Card: Storage Editor -->
    <rect x="155" y="113" width="130" height="72" rx="7" fill="url(#cardGrad2)" filter="url(#cardShadow)"/>
    <rect x="155" y="113" width="130" height="72" rx="7" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.2"/>
    <rect x="155" y="113" width="2.5" height="72" rx="1.2" fill="#8F8AE8" opacity="0.6"/>
    <text x="165" y="135" font-size="14" font-family="serif">🗄️</text>
    <text x="185" y="134" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" font-weight="700" fill="white" opacity="0.95">Storage Editor</text>
    <text x="165" y="150" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">Browse, edit &amp; delete records</text>
    <text x="165" y="161" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">in any IndexedDB database</text>
    <text x="165" y="175" font-family="'Georgia', 'Times New Roman', serif" font-size="8" fill="#8F8AE8" opacity="0.85">SQL Filters · JSON Tree</text>

    <!-- Card: Security Tools -->
    <rect x="298" y="113" width="130" height="72" rx="7" fill="url(#cardGrad3)" filter="url(#cardShadow)"/>
    <rect x="298" y="113" width="130" height="72" rx="7" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.2"/>
    <rect x="298" y="113" width="2.5" height="72" rx="1.2" fill="#C4C0F5" opacity="0.6"/>
    <text x="308" y="135" font-size="14" font-family="serif">🔒</text>
    <text x="328" y="134" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" font-weight="700" fill="white" opacity="0.95">Security Tools</text>
    <text x="308" y="150" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">Audit CSP, CORS &amp; cookies</text>
    <text x="308" y="161" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">for any web page</text>
    <text x="308" y="175" font-family="'Georgia', 'Times New Roman', serif" font-size="8" fill="#C4C0F5" opacity="0.85">CSP · CORS · Cookie Audit</text>

    <!-- Row 2 -->
    <!-- Card: Page Tools -->
    <rect x="12" y="196" width="130" height="72" rx="7" fill="url(#cardGrad2)" filter="url(#cardShadow)"/>
    <rect x="12" y="196" width="130" height="72" rx="7" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.2"/>
    <rect x="12" y="196" width="2.5" height="72" rx="1.2" fill="#6560CC" opacity="0.6"/>
    <text x="22" y="218" font-size="14" font-family="serif">🛠️</text>
    <text x="42" y="217" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" font-weight="700" fill="white" opacity="0.95">Page Tools</text>
    <text x="22" y="233" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">Inspect, measure &amp; preview</text>
    <text x="22" y="244" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">responsive layouts</text>
    <text x="22" y="258" font-family="'Georgia', 'Times New Roman', serif" font-size="8" fill="#6560CC" opacity="0.9">Inspector · Ruler · Breakpoints</text>

    <!-- Card: ADA & Validation -->
    <rect x="155" y="196" width="130" height="72" rx="7" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
    <rect x="155" y="196" width="130" height="72" rx="7" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.2"/>
    <rect x="155" y="196" width="2.5" height="72" rx="1.2" fill="#9F99E8" opacity="0.6"/>
    <text x="165" y="218" font-size="14" font-family="serif">♿</text>
    <text x="185" y="217" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" font-weight="700" fill="white" opacity="0.95">ADA &amp; Validation</text>
    <text x="165" y="233" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">WCAG 2.1 audits &amp; CSS</text>
    <text x="165" y="244" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">validation checks</text>
    <text x="165" y="258" font-family="'Georgia', 'Times New Roman', serif" font-size="8" fill="#9F99E8" opacity="0.85">Contrast · ARIA · Focus</text>

    <!-- Card: Export & Capture -->
    <rect x="298" y="196" width="130" height="72" rx="7" fill="url(#cardGrad3)" filter="url(#cardShadow)"/>
    <rect x="298" y="196" width="130" height="72" rx="7" fill="none" stroke="#9F99E8" stroke-width="0.6" opacity="0.2"/>
    <rect x="298" y="196" width="2.5" height="72" rx="1.2" fill="#D0CCFF" opacity="0.6"/>
    <text x="308" y="218" font-size="14" font-family="serif">📤</text>
    <text x="328" y="217" font-family="'Georgia', 'Times New Roman', serif" font-size="10.5" font-weight="700" fill="white" opacity="0.95">Export &amp; Capture</text>
    <text x="308" y="233" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">Screenshots, tables &amp; page</text>
    <text x="308" y="244" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" fill="#AFA9EC" opacity="0.8">content in any format</text>
    <text x="308" y="258" font-family="'Georgia', 'Times New Roman', serif" font-size="8" fill="#D0CCFF" opacity="0.85">PNG · CSV · JSON · MD</text>

  </g>
</svg>
